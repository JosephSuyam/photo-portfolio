name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 12 hours: a fallback sync that renews the 24-hour Drive webhook channel in time
    # while keeping only ~2 channels live (each one POSTs on every Drive change).
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # Sent by the Vercel function api/drive-webhook.mjs when Drive reports a change.
  repository_dispatch:
    types: [drive-changed]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can target any branch; only main goes to production.
    # repository_dispatch always runs on the default branch, which must be main.
    if: github.ref == 'refs/heads/main'
    # Secrets and variables live in the "production" environment.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      # An unset variable expands to "", which portfolio treats as unset.
      CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}
    steps:
      # Without it the live site would link to the localhost default.
      - name: Check site variables
        run: '[ -n "$SITE_BASE_URL" ] || { echo "::error::SITE_BASE_URL variable is not set"; exit 1; }'

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      # Unique key per run; restore-keys picks the newest earlier cache.
      - name: Restore Drive cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: portfolio-cache-${{ github.run_id }}
          restore-keys: portfolio-cache-

      - name: Remember previous manifest
        run: cp .cache/manifest.json "$RUNNER_TEMP/manifest.prev.json" 2>/dev/null || true

      - name: Write service account key
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$GCP_SA_KEY_JSON" > "$RUNNER_TEMP/gcp-sa.json"

      - name: Sync from Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: uv run portfolio sync

      - name: Detect changes
        id: changes
        run: |
          # Also compare the commit, so a failed code deploy is retried by the next schedule.
          # Drive also notifies about changes outside the portfolio, so dispatches skip too.
          if { [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; } \
            && cmp -s .cache/manifest.json "$RUNNER_TEMP/manifest.prev.json" \
            && [ "$(cat .cache/deployed-sha 2>/dev/null)" = "$GITHUB_SHA" ]; then
            echo "No Drive changes; skipping build and deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.changes.outputs.changed == 'true'
        run: uv run portfolio build

      - name: Deploy to Vercel
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.4.0 deploy dist --prod --yes --token "$VERCEL_TOKEN"

      # Saved only after a successful deploy, so a failed deploy is retried next run.
      - name: Record deployed commit
        if: steps.changes.outputs.changed == 'true'
        run: echo "$GITHUB_SHA" > .cache/deployed-sha

      - name: Save Drive cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: portfolio-cache-${{ github.run_id }}

      # `portfolio subscribe` opens a 24-hour channel. Every run except webhook-triggered ones
      # renews it, so one stays live across the 12-hour cron (even if GitHub delays a run)
      # and after a failed sync/deploy (the key file is written before sync). Dispatch runs skip it so channels
      # don't pile up with each Drive change. Overlapping channels only send duplicate
      # notifications, which collapse because `concurrency` keeps one pending run (newer ones
      # cancel it) and the skip-if-unchanged check.
      - name: Renew Drive webhook
        if: ${{ !cancelled() && vars.DRIVE_WEBHOOK_URL != '' && github.event_name != 'repository_dispatch' }}
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
          DRIVE_WEBHOOK_URL: ${{ vars.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_TOKEN: ${{ secrets.DRIVE_WEBHOOK_TOKEN }}
        run: uv run portfolio subscribe
