[project]
name = "portfolio"
version = "0.1.0"
description = "Static photographer portfolio generated from a Google Drive folder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "jinja2>=3.1",
    "pillow>=10.0",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.scripts]
portfolio = "portfolio.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.oauth2.*", "httplib2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
