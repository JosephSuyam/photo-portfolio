<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  {% if script_names %}
  <script>{ try { const theme = localStorage.getItem("reel-theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch (error) {} }</script>
  {% endif %}
  <link rel="stylesheet" href="{{ base_path }}static/site.css">
  {% for name in script_names %}
  <script src="{{ base_path }}static/{{ name }}" defer></script>
  {% endfor %}
</head>
<body{% if page_class %} class="{{ page_class }}"{% endif %}>
  <header class="site-header">
    <a class="site-title" href="{{ base_path }}">{{ site_title }}</a>
    <nav class="site-nav">
      <a href="{{ base_path }}work/"{% if nav_work_current %} aria-current="page"{% endif %}>Work</a>
      {% if script_names %}
      <button type="button" class="theme-toggle" hidden aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p class="footer-title">{{ site_title }}</p>
    <p>&copy; {{ year }}</p>
  </footer>
</body>
</html>
