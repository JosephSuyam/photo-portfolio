{% extends "base.html" %}
{% block content %}
<ul class="album-grid">
  {% for album in albums %}
  <li>
    <a href="{{ base_path }}{{ album.slug }}/">
      <picture>
        <source srcset="{{ album.cover_webp_url }}" type="image/webp">
        <img src="{{ album.cover_url }}" width="{{ album.cover_width }}"
             height="{{ album.cover_height }}" alt="{{ album.title }}" loading="lazy">
      </picture>
      <span class="album-title">{{ album.title }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
